<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --fg: #e8eaf0;
        --muted: #8b93a7;
        --accent: #7c5cff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(124, 92, 255, 0.28), transparent 60%),
          var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        user-select: none;
      }
      main { display: grid; justify-items: center; gap: 18px; }
      img { width: 92px; height: 92px; filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.45)); }
      h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <img src="../assets/icon.png" alt="" />
      <h1>DeepSeek Harness</h1>
      <div class="spinner" role="progressbar" aria-label="starting"></div>
      <p>正在启动 dsh web…</p>
    </main>
  </body>
</html>
